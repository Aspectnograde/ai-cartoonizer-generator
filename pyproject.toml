[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cartoonizer-generator"
version = "0.9.4"
description = "Desktop AI cartoonizer — stylize photos, frames, and video into cartoon/anime/comic art with ONNX + OpenCV backends."
readme = "docs/OVERVIEW.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "ai-cartoonizer-generator contributors" }]
keywords = ["cartoonizer", "anime", "style-transfer", "onnx", "opencv", "desktop", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "numpy>=1.26,<2.2",
    "opencv-python>=4.9,<4.12",
    "onnxruntime>=1.17,<1.21",
    "Pillow>=10.2,<11.1",
    "PySide6>=6.6,<6.9",
    "pydantic>=2.6,<2.10",
    "platformdirs>=4.1,<5.0",
    "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17,<1.21"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "ruff>=0.4,<0.8",
    "mypy>=1.9,<1.15",
]

[project.scripts]
cartoonizer = "bootstrap.app:main"

[project.gui-scripts]
cartoonizer-gui = "bootstrap.launcher:run_gui"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "bootstrap*",
    "cartoonizer_core*",
    "handlers*",
    "services*",
    "models*",
    "utils*",
    "config*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true